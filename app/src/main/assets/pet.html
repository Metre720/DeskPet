function lYear(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1)sum+=(lunarInfo[y-1900]&i)?1:0;return sum+leapDays(y);}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function leapDays(y){if(leapMonth(y))return (lunarInfo[y-1900]&0x10000)?30:29;return 0;}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function solarToLunar(yy,mm,dd){
  var baseDate=new Date(1900,0,31);var objDate=new Date(yy,mm-1,dd);
  var offset=Math.floor((objDate-baseDate)/86400000);
  var i,temp=0,ly=1900;
  for(i=1900;i<2100&&offset>0;i++){temp=lYear(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  ly=i;
  var isLeap=false;var lm=0;
  var leap=leapMonth(ly);
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===(leap+1)&&!isLeap){--i;isLeap=true;temp=leapDays(ly);}
    else{temp=monthDays(ly,i);}
    if(isLeap&&i===(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===(leap+1)){isLeap=!isLeap;}
  if(offset<0){offset+=temp;--i;}
  lm=i;var ld=offset+1;
  return {month:lm,day:ld};
}

function getTodayFestival(){
  var now=new Date();
  var sm=now.getMonth()+1,sd=now.getDate();
  var lunar=solarToLunar(now.getFullYear(),sm,sd);
  for(var key in festivals){
    var f=festivals[key];
    if(f.solar&&f.solar.month===sm&&f.solar.day===sd)return f;
    if(f.lunar&&f.lunar.month===lunar.month&&f.lunar.day===lunar.day)return f;
  }
  return null;
}

function getTimeSlot(){
  var h=new Date().getHours();

  }
  return 'night';
}

function pickUnused(pool,usedList){
  var available=[];
  for(var i=0;i<pool.length;i++){
    if(usedList.indexOf(pool[i])===-1)available.push(pool[i]);
  }
  if(available.length===0)return null;
  return available[Math.floor(Math.random()*available.length)];
}

  if(word){

  }
}

  for(var i=lonelyStages.length-1;i>=0;i--){
    if(elapsed>=lonelyStages[i].time){newLevel=i;break;}

  if(newLevel>=0 && newLevel!==lonelyLevel-1){
    lonelyLevel=newLevel+1;
    isLonely=true;
    if(todayFestival&&Math.random()<0.5){
      loadState(todayFestival.anim);

      loadState(stage.state);
      if(stage.msg)showBubble(stage.msg);
    }
    if(idleTimer){clearInterval(idleTimer);idleTimer=null;}
  }
}

function loadState(name){
  if(!states[name])name='idle';
  currentState=name;
  var xhr=new XMLHttpRequest();
  xhr.open('GET',states[name],true);
  xhr.onload=function(){
    if(xhr.status===200){
      petDiv.innerHTML=xhr.responseText;
      var svg=petDiv.querySelector('svg');
      if(svg){
        svg.setAttribute('viewBox','-5 -3 26 22');
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.style.width='100%';
        svg.style.height='100%';
      }
    }
  };
  xhr.send();
}

// === BATHING TIME SYSTEM (21:00-23:00) ===
var bathingTriggered=false;
var bathingTimer=null;
function checkBathingTime(){
  var h=new Date().getHours();
  if(h>=21&&h<23&&!bathingTriggered&&!isMini&&!isLonely){
    bathingTriggered=true;
    var bathCount=0;
    loadState('dailyBathing');
    showBubble('洗澡时间~');
    if(idleTimer){clearInterval(idleTimer);idleTimer=null;}
    var bathLoop=setInterval(function(){
      bathCount++;
      if(bathCount>=3){clearInterval(bathLoop);backToIdle();}
      else{loadState('dailyBathing');}
    },12000);
  }
  if(h>=23||h<21){bathingTriggered=false;}
}
bathingTimer=setInterval(checkBathingTime,60000);

}
