<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
#pet-container {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  animation: breathe 3s ease-in-out infinite;
}
#pet {
  width:100%; height:100%;
  background-image: url('sprite.png');
  background-size: 300% 300%;
  background-position: 0% 0%;
  transition: opacity 0.3s ease, transform 0.1s ease;
  opacity:1;
}
#pet.react { transform: scale(0.85); }
#pet.switching { opacity:0; }
#bubble {
  position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75); color:#fff; font-size:10px;
  padding:2px 6px; border-radius:8px; white-space:nowrap;
  opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
#bubble.show { opacity:1; }
@keyframes breathe {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
</style>
</head>
<body>
<div id="pet-container">
  <div id="pet"></div>
  <div id="bubble"></div>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const poses = {
  idle:'0% 0%', yawn:'50% 0%', sleep:'100% 0%',
  smile:'0% 50%', surprise:'50% 50%', angry:'100% 50%',
  zzz:'0% 100%', wink:'50% 100%', hug:'100% 100%'
};
let currentPose='idle', idleTimer=null, bubbleTimer=null;

function switchPose(name){
  if(!poses[name]||name===currentPose)return;
  pet.classList.add('switching');
  setTimeout(()=>{
    pet.style.backgroundPosition=poses[name];
    currentPose=name;
    pet.classList.remove('switching');
  },150);
}
function showBubble(text){
  bubble.textContent=text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),2500);
}
function reactThen(pose){
  pet.classList.add('react');
  setTimeout(()=>{pet.classList.remove('react');switchPose(pose);},120);
}

const tapTexts=['干嘛戳我！','哎呀~','手欠是吧','嗯？','轻点啦','你想干啥','又戳！','烦诶','痒~'];
const dblTexts=['好啦好啦知道你想我','别闹了','亲一个？','哼，原谅你了','你今天真黏人','我在呢'];
const longTexts=['你按着我干嘛...','想把我按扁吗','放开我！','我要窒息了','你手真重','救命'];

let touchStart=0,lastTap=0,longTimer=null;
pet.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  touchStart=Date.now();
  longTimer=setTimeout(()=>{reactThen('angry');showBubble(longTexts[Math.floor(Math.random()*longTexts.length)]);},800);
});
pet.addEventListener('touchend',()=>{
  clearTimeout(longTimer);
  const dt=Date.now()-touchStart;
  if(dt>=800)return;
  const now=Date.now();
  if(now-lastTap<400){
    reactThen('hug');showBubble(dblTexts[Math.floor(Math.random()*dblTexts.length)]);lastTap=0;
  } else {
    lastTap=now;
    setTimeout(()=>{if(lastTap!==0&&Date.now()-lastTap>=380){reactThen('surprise');showBubble(tapTexts[Math.floor(Math.random()*tapTexts.length)]);lastTap=0;}},400);
  }
});

function startIdleCycle(){
  clearTimeout(idleTimer);
  const cycle=['idle','yawn','smile','wink','idle','sleep'];
  let idx=0;
  function next(){switchPose(cycle[idx%cycle.length]);idx++;idleTimer=setTimeout(next,8000+Math.random()*7000);}
  idleTimer=setTimeout(next,10000);
}
startIdleCycle();
pet.addEventListener('touchstart',()=>{startIdleCycle();});
</script>
</body>
</html>
